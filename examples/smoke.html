<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>artoolkit5 wasm smoke</title>
</head>
<body>

<script type="module">
  import createModule from "./../dist/artoolkit5.js";
  import { loadCameraFromUrl, addMarkerFromUrl, createARToolKit } from "./../dist/index.js"

  const mod = await createModule({
    locateFile(path) {
      return "./../dist/" + path; // risolve artoolkit5.wasm
    },
  });

  const artk = await createARToolKit(mod);
  console.log("artk:", artk);

  console.log("Loaded", mod);
  console.log("HEAPU8 length:", mod.HEAPU8?.length);
  console.log("FS:", typeof mod.FS);

  const width = 640;
  const height = 480;

  console.log("mod: ", mod);
  

  const core = new mod.ARToolKitCore();
  try {
    console.log("Loading camera...");
    const cameraId = await loadCameraFromUrl(mod, core, "./data/camera_para.dat");
    console.log("Camera loaded, ID:", cameraId);

    console.log("Running core.setup...");
    await core.setup(width, height, cameraId);
    console.log("core.setup complete");

    console.log("Loading marker...");
    const patt_id = await addMarkerFromUrl(mod, core, "./data/patt.hiro");
    console.log("Marker loaded, ID:", patt_id);
  } catch (e) {
    console.error("Error during ARToolKit setup:", e);
    throw e;
  }

  console.log(core)
  console.log("AR_DEBUG_ENABLE:", artk.constants.AR_DEBUG_ENABLE);
  console.log("LOG_DEBUG:", artk.constants.AR_LOG_LEVEL_DEBUG);
  console.log("THRESH_MANUAL:", artk.constants.AR_LABELING_THRESH_MODE_MANUAL);

  // Newly reachable: barcode marker configuration was impossible before,
  // because no AR_MATRIX_CODE_* value was exported.
  console.log("MATRIX_CODE_3x3:", artk.constants.AR_MATRIX_CODE_3x3);
  console.log("COLOR_AND_MATRIX:", artk.constants.AR_TEMPLATE_MATCHING_COLOR_AND_MATRIX);

  console.log("AR_DEBUG_DISABLE from artk: ", artk.constants.AR_DEBUG_DISABLE);
  

  console.log("instance keys", Object.getOwnPropertyNames(core));
  console.log("proto keys", Object.getOwnPropertyNames(Object.getPrototypeOf(core)));
  console.log("ctor keys", Object.getOwnPropertyNames(mod.ARToolKitCore));

  document.body.append("OK");
</script>
</body>
</html>
