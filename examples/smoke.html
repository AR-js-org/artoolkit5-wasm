<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>artoolkit5 wasm smoke</title>
</head>
<body>

<script type="module">
  import createModule from "./../dist/artoolkit5.js";
  import { fetchBinary, storeDataFile, loadCameraFromUrl, addMarker } from "./utils.js";

  const mod = await createModule({
    locateFile(path) {
      return "./../dist/" + path; // risolve artoolkit5.wasm
    },
  });

  console.log("Loaded", mod);
  console.log("HEAPU8 length:", mod.HEAPU8?.length);
  console.log("_malloc:", typeof mod._malloc);
  console.log("_free:", typeof mod._free);

  const ptr = mod._malloc(64);
  mod._free(ptr);

  const width = 640;
  const height = 480;

  const core = new mod.ARToolKitCore();
  const cameraId = await loadCameraFromUrl(mod, core, "./data/camera_para.dat");
  await core.setup(width, height, cameraId);   // pick your width/height
  const patt_id = await addMarker(mod, core, "./data/patt.hiro");
  console.log("patt_id:", patt_id);

  console.log(core)
  console.log("error not initialized: ", core.ERROR_NOT_INITIALIZED_())
  console.log("AR_DEBUG_ENABLE:", core.AR_DEBUG_ENABLE_?.());
  console.log("LOG_DEBUG:", mod.ARToolKitCore.AR_LOG_LEVEL_DEBUG_?.());
  console.log("THRESH_MANUAL:", mod.ARToolKitCore.AR_LABELING_THRESH_MODE_MANUAL_?.());

  console.log("instance keys", Object.getOwnPropertyNames(core));
  console.log("proto keys", Object.getOwnPropertyNames(Object.getPrototypeOf(core)));
  console.log("ctor keys", Object.getOwnPropertyNames(mod.ARToolKitCore));

  console.log("inst LOG_DEBUG", core.AR_LOG_LEVEL_DEBUG_?.());
  console.log("proto LOG_DEBUG", Object.getPrototypeOf(core).AR_LOG_LEVEL_DEBUG_?.());
  console.log("ctor LOG_DEBUG", mod.ARToolKitCore.AR_LOG_LEVEL_DEBUG_?.());

  console.log("Module LOG_DEBUG", mod.AR_LOG_LEVEL_DEBUG); // a volte le mette su Module

  document.body.append("OK");
</script>
</body>
</html>
