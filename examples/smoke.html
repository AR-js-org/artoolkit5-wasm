<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>artoolkit5 wasm smoke</title>
</head>
<body>

<script type="module">
  import createModule from "./../dist/artoolkit5.js";
  import { loadCameraFromUrl, addMarkerFromUrl } from "./../dist/index.js"

  const mod = await createModule({
    locateFile(path) {
      return "./../dist/" + path; // risolve artoolkit5.wasm
    },
  });

  console.log("Loaded", mod);
  console.log("HEAPU8 length:", mod.HEAPU8?.length);
  console.log("FS:", typeof mod.FS);

  const width = 640;
  const height = 480;

  const core = new mod.ARToolKitCore();
  const cameraId = await loadCameraFromUrl(mod, core, "./data/camera_para.dat");
  await core.setup(width, height, cameraId);   // pick your width/height
  const patt_id = await addMarkerFromUrl(mod, core, "./data/patt.hiro");
  console.log("patt_id:", patt_id);

  console.log(core)
  console.log("AR_DEBUG_ENABLE:", mod.AR_DEBUG_ENABLE);
  console.log("LOG_DEBUG:", mod.AR_LOG_LEVEL_DEBUG);
  console.log("THRESH_MANUAL:", mod.AR_LABELING_THRESH_MODE_MANUAL);

  console.log("instance keys", Object.getOwnPropertyNames(core));
  console.log("proto keys", Object.getOwnPropertyNames(Object.getPrototypeOf(core)));
  console.log("ctor keys", Object.getOwnPropertyNames(mod.ARToolKitCore));

  document.body.append("OK");
</script>
</body>
</html>
