<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>ARToolKit5 WASM – Webcam Test</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #eee;
            font-family: sans-serif;
        }

        #view {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        #overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #log {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <video id="view" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="log">Starting…</div>

    <script type="module">
        import createModule from "./../dist/artoolkit5.js";
        import { fetchBinary, storeDataFile, loadCameraFromUrl, addMarker } from "./utils.js";

        const cameraParam = '../data/camera_para.dat';   // adjust path
        const markerPatt = '../data/patt.hiro';         // adjust path

        const video = document.getElementById('view');
        const canvas = document.getElementById('overlay');
        const log = (msg) => document.getElementById('log').textContent = msg;

        async function start() {
            // Get webcam
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
            video.srcObject = stream;
            await video.play();

            // Wait for dimensions (resolve immediately if already available)
            if (video.videoWidth && video.videoHeight) {
                // ready
            } else {
                await new Promise((resolve, reject) => {
                    const onMeta = () => {
                        video.removeEventListener('loadedmetadata', onMeta);
                        resolve();
                    };
                    const onErr = (e) => {
                        video.removeEventListener('loadedmetadata', onMeta);
                        reject(e);
                    };
                    video.addEventListener('loadedmetadata', onMeta, { once: true });
                    video.addEventListener('error', onErr, { once: true });
                });
            }
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            log('Initializing AR…');

            const mod = await createModule({
                locateFile(path) {
                    return "./../dist/" + path; // risolve artoolkit5.wasm
                },
            });

            //const ptr = mod._malloc(64);
            //mod._free(ptr);

            const width = 640;
            const height = 480;

            const canvas_process = document.createElement("canvas");
            canvas_process.width = width;
            canvas_process.height = height;
            const context_process = canvas_process.getContext("2d", {
                willReadFrequently: true,
            });

            const core = new mod.ARToolKitCore();
            const cameraId = await loadCameraFromUrl(mod, core, "./data/camera_para.dat");
            await core.setup(width, height, cameraId);   // pick your width/height
            const patt_id = await addMarker(mod, core, "./data/patt.hiro");
            console.log("patt_id:", patt_id);

            const rgbaSize = width * height * 4;
            const rgbaPtr = mod._malloc(rgbaSize);
            const grayPtr = mod._malloc(width * height);

            let heapBuffer = mod.HEAPU8.buffer;
            let rgbaView = new Uint8Array(heapBuffer, rgbaPtr, rgbaSize);
            let grayView = new Uint8Array(heapBuffer, grayPtr, width * height);

            const refreshViews = () => {
                if (heapBuffer !== mod.HEAPU8.buffer) {
                    heapBuffer = mod.HEAPU8.buffer;
                    rgbaView = new Uint8Array(heapBuffer, rgbaPtr, rgbaSize);
                    grayView = new Uint8Array(heapBuffer, grayPtr, width * height);
                }
            };

            const process = function () {
                refreshViews();

                context_process.fillStyle = "black";
                context_process.fillRect(0, 0, width, height);
                context_process.drawImage(video, 0, 0, width, height);

                const imageData = context_process.getImageData(0, 0, width, height);
                convert2gray(imageData.data, grayView, width * height);

                rgbaView.set(imageData.data);
                core.setFrameRGBA(rgbaPtr, rgbaSize);
                core.setFrameGRAY(grayPtr, width * height);
            };

            const convert2gray = function (srcRGBA, dstGray, numPixels) {
                for (let p = 0, q = 0; p < numPixels; p++, q += 4) {
                    const r = srcRGBA[q], g = srcRGBA[q + 1], b = srcRGBA[q + 2];
                    dstGray[p] = (r + r + r + b + g + g + g + g) >> 3;
                }
                return dstGray;
            };


            // Main loop
            function tick() {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    process()
                }
                requestAnimationFrame(tick);
            }
            tick();

            log('Running. Show the marker to the camera.');
        }

        start().catch((err) => {
            console.error(err);
            log('Error: ' + err.message);
        });
    </script>
</body>

</html>
