<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>ARToolKit5 WASM – Webcam Test</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #eee;
            font-family: sans-serif;
        }

        #view {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        #overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #log {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            border-radius: 4px;
        }

        #controls {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #controls a {
            color: #8cf;
        }
    </style>
</head>

<body>
    <video id="view" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="log">Starting…</div>
    <div id="controls">
        <label>detection mode
            <select id="mode"></select>
        </label>
        <a href="./data/marker_05_3x3.jpg" target="_blank">barcode marker (ID 5)</a>
    </div>

    <script type="module">
        import createModule from "./../dist/artoolkit5.js";
        import {
            loadCameraFromUrl,
            addMarkerFromUrl,
            AR_TEMPLATE_MATCHING_COLOR,
            AR_TEMPLATE_MATCHING_MONO,
            AR_MATRIX_CODE_DETECTION,
            AR_TEMPLATE_MATCHING_COLOR_AND_MATRIX,
            AR_TEMPLATE_MATCHING_MONO_AND_MATRIX,
            AR_MATRIX_CODE_3x3
        } from "./../dist/index.js";
        import ARController from "./ARController.js";

        // Show both markers at once to exercise the combined modes: the Hiro pattern
        // (data/patt.hiro) and the 3x3 barcode encoding ID 5 (data/marker_05_3x3.jpg).
        // Only the combined modes detect both families in a single frame.
        const DETECTION_MODES = [
            ['color', AR_TEMPLATE_MATCHING_COLOR],
            ['mono', AR_TEMPLATE_MATCHING_MONO],
            ['matrix', AR_MATRIX_CODE_DETECTION],
            ['color+matrix', AR_TEMPLATE_MATCHING_COLOR_AND_MATRIX],
            ['mono+matrix', AR_TEMPLATE_MATCHING_MONO_AND_MATRIX]
        ];

        const BARCODE_ID = 5;

        const video = document.getElementById('view');
        const canvas = document.getElementById('overlay');
        const log = (msg) => document.getElementById('log').textContent = msg;

        async function start() {
            // Get webcam
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
            video.srcObject = stream;
            await video.play();

            // Wait for dimensions (resolve immediately if already available)
            if (video.videoWidth && video.videoHeight) {
                // ready
            } else {
                await new Promise((resolve, reject) => {
                    const onMeta = () => {
                        video.removeEventListener('loadedmetadata', onMeta);
                        resolve();
                    };
                    const onErr = (e) => {
                        video.removeEventListener('loadedmetadata', onMeta);
                        reject(e);
                    };
                    video.addEventListener('loadedmetadata', onMeta, { once: true });
                    video.addEventListener('error', onErr, { once: true });
                });
            }
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            log('Initializing AR…');

            const mod = await createModule({
                locateFile(path) {
                    return "./../dist/" + path; // risolve artoolkit5.wasm
                },
            });

            //const ptr = mod._malloc(64);
            //mod._free(ptr);

            const width = 640;
            const height = 480;

            const canvas_process = document.createElement("canvas");
            canvas_process.width = width;
            canvas_process.height = height;
            const context_process = canvas_process.getContext("2d", {
                willReadFrequently: true,
            });

            const core = new mod.ARToolKitCore();
            console.log("core: ", core);
            try {
                const cameraId = await loadCameraFromUrl(mod, core, "./data/camera_para.dat");
                await core.setup(width, height, cameraId);   // pick your width/height
                const patt_id = await addMarkerFromUrl(mod, core, "./data/patt.hiro");
                console.log("patt_id:", patt_id);

                const controller = new ARController(mod, core, width, height);
                controller.trackMarker(patt_id, 1.0);
                controller.trackBarcodeMarker(BARCODE_ID, 1.0);

                // Both families stay registered in every mode. Under a single mode the other
                // family simply never matches, so no special-casing is needed here.
                const applyDetectionMode = (mode) => {
                    core.setPatternDetectionMode(mode);
                    core.setMatrixCodeType(AR_MATRIX_CODE_3x3);
                };

                const modeSelect = document.getElementById('mode');
                for (const [label, value] of DETECTION_MODES) {
                    const option = document.createElement('option');
                    option.value = String(value);
                    option.textContent = label;
                    modeSelect.appendChild(option);
                }
                // Defaults to a combined mode so both markers are detected out of the box.
                modeSelect.value = String(AR_TEMPLATE_MATCHING_MONO_AND_MATRIX);
                modeSelect.onchange = () => applyDetectionMode(Number(modeSelect.value));
                applyDetectionMode(AR_TEMPLATE_MATCHING_MONO_AND_MATRIX);

                // Track detection state to avoid spamming the console on every frame.
                // We log the detailed matrices only on first detection and when lost.
                let wasDetected = false;

                const process = function () {
                    context_process.fillStyle = "black";
                    context_process.fillRect(0, 0, width, height);
                    context_process.drawImage(video, 0, 0, width, height);

                    const imageData = context_process.getImageData(0, 0, width, height);
                    
                    const activeMarkers = controller.process(imageData.data);
                    if (activeMarkers.length > 0) {
                        // The UI DOM element is updated on every frame to show real-time detection status
                        log("Detected: " + activeMarkers.map(m => `${m.type} id ${m.id}`).join(", "));

                        // Console logs for matrices are output only on the first detection transition
                        // to avoid console spam and maintain browser rendering performance.
                        if (!wasDetected) {
                            for (const marker of activeMarkers) {
                                console.log(`Detected ${marker.type} marker ID: ${marker.id}`);
                                console.log(`Pose Matrix (3x4):`, marker.matrix);
                                console.log(`GL Matrix (4x4):`, marker.matrixGL);
                            }
                            wasDetected = true;
                        }
                    } else {
                        log("Running. Show the marker to the camera.");
                        
                        // Print to console only when the marker transition to lost occurs
                        if (wasDetected) {
                            console.log("Marker lost");
                            wasDetected = false;
                        }
                    }
                };

                function tick() {
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        process()
                    }
                    requestAnimationFrame(tick);
                }
                tick();

                log('Running. Show the marker to the camera.');





            } catch (e) {
                console.error("Error during ARToolKit setup:", e);
                throw e;
            }
        }
        start().catch((err) => {
            console.error(err);
            log('Error: ' + err.message);
        });
    </script>
</body>

</html>
