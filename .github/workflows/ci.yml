name: CI

on:
  push:
    branches: [ main, dev ]
  # No branch filter: PRs are sometimes stacked on another feature branch, and a
  # filter on the base branch would leave those with no CI at all.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run C++ Linter
        run: npm run lint:cpp

      - name: Compile WebAssembly
        env:
          CI: true
        run: npm run build:wasm

      - name: Build JS/TS Wrapper
        run: npm run build:wrap

      - name: Run tests
        run: npm test
