name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Run C++ Linter
        run: npm run lint:cpp

      # DEBUG=1 matches the configuration the committed dist/ was built with
      # (-g2, ASSERTIONS=1, --profiling, unminified). It is set explicitly so
      # CI reproduces the shipped artifact rather than a Release build, which
      # would otherwise make the sync check below fail on every run.
      # Switching the shipped artifact to Release is a separate decision.
      - name: Compile WebAssembly
        env:
          CI: true
          DEBUG: 1
        run: npm run build:wasm

      - name: Build JS/TS Wrapper
        run: npm run build:wrap

      # Guards against a stale committed binary. Without this, a change to the
      # C++ bindings could merge while dist/ still holds the previously built
      # WebAssembly: CI only proves the source compiles, never that the
      # committed artifacts actually match it.
      #
      # Scoped to the Emscripten outputs on purpose. Two clean builds of those
      # are byte-identical (verified for both Release and DEBUG configs), so
      # comparing them is safe. The wrapper outputs are not comparable:
      # dist/index.js.map embeds sourcesContent using the working tree's line
      # endings, so it differs between a CRLF checkout and this LF runner.
      # package-lock.json is excluded because the install step regenerates it.
      - name: Check committed WebAssembly is up to date
        run: |
          if [[ -n $(git status --porcelain -- dist/artoolkit5.wasm dist/artoolkit5.js) ]]; then
            echo "::error::dist/artoolkit5.wasm or dist/artoolkit5.js is out of sync with the C++ sources."
            echo "Run 'npm run build:wasm' locally and commit the result."
            git status --porcelain -- dist/artoolkit5.wasm dist/artoolkit5.js
            exit 1
          fi
          echo "Committed WebAssembly matches a clean build."
