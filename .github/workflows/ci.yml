name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93220556e54508493d9370163351d331908 # v6.0.0
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@48b55a0532822a45d06b12a87a6d8924b2203794 # v6.4.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Run C++ Linter
        run: npm run lint:cpp

      - name: Compile WebAssembly
        env:
          CI: true
        run: npm run build:wasm

      - name: Build JS/TS Wrapper
        run: npm run build:wrap
